version: "3.9"

services:

  registry:
    build:
      context: .
      dockerfile: registry/Dockerfile
    container_name: eureka-registry
    ports:
      - "8761:8761"
    networks:
      - gateway-net
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8761/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  gateway:
    build:
      context: .
      dockerfile: gateway/Dockerfile
    container_name: api-gateway
    ports:
      - "8000:8080"
    environment:
      - EUREKA_URL=http://registry:8761/eureka/
    networks:
      - gateway-net
    depends_on:
      registry:
        condition: service_healthy

networks:
  gateway-net:
    driver: bridge
spring.application.name=ClienteServidor
# Desactivar el restart automatico de DevTools (evita que pida config dos veces)
spring.devtools.restart.enabled=false

# Base de datos MySQL
# rewriteBatchedStatements=true \u00e2\u0086\u0092 el driver agrupa m\u00c3\u00baltiples INSERT en un solo
# paquete de red en lugar de enviarlos uno a uno, reduciendo drasticamente el
# n\u00c3\u00bamero de roundtrips al servidor.
spring.datasource.url=jdbc:mysql://localhost:3306/cliente_servidor_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&rewriteBatchedStatements=true&allowMultiQueries=true&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=Cristian6
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=false
# Batch grande: agrupa hasta 50 INSERTs en un solo roundtrip a la BD
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.jdbc.batch_versioned_data=true

# Hikari \u00e2\u0080\u0094 m\u00c3\u00a1s conexiones para que los hilos background no se bloqueen entre s\u00c3\u00ad
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=60000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=600000

# Servidor web embebido para HTTP REST API
spring.main.web-application-type=servlet
server.port=8080

# Modelo ONNX para identificaci\u00c3\u0083\u00c2\u00b3n de emociones
emotion.model.path=src/main/java/Cliente_Servidor/V1/Modelos/EmocionesInferencia/modelo_emociones_final.onnx

# Nombre que identifica a este servidor en el cluster
servidor.nombre=Servidor-A
# IP/hostname que los otros servidores usar\u00e1n para conectarse a \u00e9ste
servidor.host=localhost
# Puerto TCP de este servidor
servidor.tcp.puerto=5000
# Puerto UDP de este servidor
servidor.udp.puerto=6000
# Alias para el servicio distribuido (debe coincidir con servidor.tcp.puerto)
servidor.puerto=${servidor.tcp.puerto}
# Peer de bootstrap para unirse a la red (solo necesitas conocer uno)
# Ejemplo: servidor.amigos=localhost:5001
servidor.amigos=


eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka/}
eureka.instance.prefer-ip-address=true
eureka.instance.instance-id=${spring.cloud.client.ip-address}:${servidor.nombre}:${server.port}
eureka.instance.metadata-map.endpoints=/api/documentos,/api/emociones,/api/emociones/resumen,/api/logs,/api/usuarios

spring.cloud.inetutils.ignored-interfaces=VirtualBox.*,VMware.*,Hyper-V.*,vEthernet.*,docker.*,br-.*
spring.cloud.inetutils.preferred-networks=192.168.1,192.168.0,10.0